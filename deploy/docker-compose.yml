# Uruchomienie całej aplikacji w dockerze.
#
#   cp deploy/.env.example deploy/.env      # raz, potem edytuj według potrzeb
#   docker compose -f deploy/docker-compose.yml up --build
#   otwórz http://localhost:8080
#
# Zatrzymanie:  docker compose -f deploy/docker-compose.yml down
# Z danymi:     docker compose -f deploy/docker-compose.yml down -v

name: asystent-urzednika

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: asystent-urzednika-backend:latest
    # Plik musi istnieć — patrz krok `cp deploy/.env.example deploy/.env` w README.
    env_file:
      - .env
    environment:
      # Ścieżki w kontenerze nadpisują wartości z .env.
      DATABASE_URL: sqlite:////srv/data/app.db
      FIXTURES_DIR: /srv/fixtures
      MODULE_MODE_DEFAULT: ${MODULE_MODE_DEFAULT:-fake}
      OFFLINE: ${OFFLINE:-false}
      # Frontend jest serwowany z tego samego hosta, ale innego portu.
      CORS_ORIGINS: '["http://localhost:${APP_PORT:-8080}","http://127.0.0.1:${APP_PORT:-8080}"]'
    volumes:
      # Baza SQLite i pliki wgrane przez użytkownika przeżywają restart kontenera.
      - app-data:/srv/data
    # Pozwala kontenerowi dobić się do modelu działającego na hoście
    # (np. Ollama pod http://host.docker.internal:11434).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    image: asystent-urzednika-frontend:latest
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
