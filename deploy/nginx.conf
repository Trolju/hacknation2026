# nginx dla frontendu: SPA + proxy /api do backendu.
# Plik trafia do /etc/nginx/conf.d/default.conf w obrazie nginx:alpine.

upstream backend_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nie zdradzamy wersji nginx w nagłówkach.
    server_tokens off;

    # Limit uploadu: aplikacja przyjmuje pliki do 10 MB (MAX_UPLOAD_BYTES).
    client_max_body_size 12m;

    # ── nagłówki bezpieczeństwa ───────────────────────────────────────────
    # Uwaga: `add_header` w bloku `location` kasuje dziedziczenie z `server`,
    # dlatego poniżej nie ma już żadnego `add_header` — cache ustawiamy
    # dyrektywą `expires`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # ── kompresja ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # ── API ───────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Eksport DOCX/PDF i generowanie odpowiedzi mogą trwać dłużej niż domyślne 60 s.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Pliki binarne lecą od razu do klienta, bez buforowania na dysku.
        proxy_buffering off;
    }

    # ── statyki z hashem w nazwie — mogą być cache'owane na rok ───────────
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ── SPA fallback: każda nieznana ścieżka zwraca index.html ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html musi być zawsze świeży, inaczej po wdrożeniu klient trzyma
    # referencje do nieistniejących plików z /assets/.
    location = /index.html {
        expires -1;
    }
}
